<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enhanced Multiplication Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <h1>Multiplication Table</h1>

    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" placeholder="e.g. 5" />

    <label for="rangeInput">Select range (1 to ...):</label>
    <input type="number" id="rangeInput" value="10" min="1" />

    <label for="loopType">Select loop type:</label>
    <select id="loopType">
      <option value="for">For Loop</option>
      <option value="while">While Loop</option>
      <option value="do-while">Do-While Loop</option>
    </select>

    <div class="checkboxes">
      
      <label><input type="checkbox" id="darkModeToggle" /> Dark Mode</label>
    </div>

    <button onclick="generateTable()">Generate</button>
    <button onclick="copyToClipboard()">Copy</button>
    
    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
